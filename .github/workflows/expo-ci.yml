name: Expo CI

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'test/*'
  pull_request:
    branches:
      - main
      - 'feature/*'
      - 'test/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Expo Doctor
        run: npx expo-doctor
